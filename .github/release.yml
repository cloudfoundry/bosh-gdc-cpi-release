# Configuration for GitHub's auto-generated release notes ("What's Changed" section).
# scripts/release-cpi.sh appends these generated notes to every vX.Y.Z GitHub Release
# via the repos/{repo}/releases/generate-notes API (previous_tag_name = latest final tag).
# Docs: https://docs.github.com/en/repositories/releasing-projects-on-github/automatically-generated-release-notes

changelog:
  exclude:
    labels:
      - skip-changelog
      - no-release-notes
    authors:
      - github-actions[bot]
      - dependabot[bot]
  categories:
    - title: 🚀 Features
      labels:
        - enhancement
        - feature
    - title: 🐛 Bug Fixes
      labels:
        - bug
        - fix
    - title: 🔒 Security
      labels:
        - security
    - title: 🧪 CI / Release Pipeline
      labels:
        - ci
        - release-pipeline
    - title: 📚 Documentation
      labels:
        - documentation
    - title: ⬆️ Dependencies
      labels:
        - dependencies
    - title: Other Changes
      labels:
        - "*"
