name: Deploy Release Dashboard to Pages

on:
  push:
    branches:
      - main
      - feat/concourse-pipeline
    paths:
      - 'dashboard/**'
      - '.github/workflows/deploy-dashboard.yaml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      # The release pipeline also publishes dashboard/data/runs.json to Pages (and commits it back
      # to the branch it ran on). Merge the live Pages data with the committed file before deploying
      # so a plain push can never overwrite runs that were recorded by the pipeline.
      - name: Reconcile Dashboard Data with Live Pages Data
        env:
          RECONCILE_ONLY: "true"
          PUSH_DASHBOARD_DATA: "false"
        run: ./scripts/update-dashboard.sh

      - name: Setup Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5.0.0

      - name: Upload Artifact
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: './dashboard'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
