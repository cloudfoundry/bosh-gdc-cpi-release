name: Deploy Release Dashboard to Pages

on:
  push:
    branches:
      - main
      - feat/concourse-pipeline
    paths:
      - 'dashboard/**'
      - '.github/workflows/deploy-dashboard.yaml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The release pipeline also publishes dashboard/data/runs.json to Pages (and commits it back
      # to the branch it ran on). Merge the live Pages data with the committed file before deploying
      # so a plain push can never overwrite runs that were recorded by the pipeline.
      - name: Reconcile Dashboard Data with Live Pages Data
        env:
          RECONCILE_ONLY: "true"
          PUSH_DASHBOARD_DATA: "false"
        run: ./scripts/update-dashboard.sh

      - name: Setup Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Upload Artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: './dashboard'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
