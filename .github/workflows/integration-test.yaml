name: Presubmit Integration Test

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - main
    # No paths-ignore: "BOSH CPI Integration Test (GDC Staging)" is a required status
    # check on main, so the workflow must always report on every PR. Non-code changes
    # are detected by should_skip_non_code_changes in scripts/ci-common.sh, which
    # short-circuits the run with a passing check instead of leaving it missing.
  issue_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      pr_number:
        description: 'Pull Request number to test (leave empty to test the selected branch)'
        required: false
        type: string
      filter:
        description: 'Regex filter for integration tests (e.g. TestMultizoneDiskMethods, TestMultizoneVMAndDiskMethods, TestMultizone; leave empty for auto-detect)'
        required: false
        default: ''
        type: string

permissions:
  contents: read

jobs:
  integration-test:
    name: BOSH CPI Integration Test (GDC Staging)
    if: >
      github.event_name != 'issue_comment' ||
      (github.event.issue.pull_request != null &&
       contains(github.event.comment.body, '/test-integration'))
    runs-on: ubuntu-latest
    environment: cfbosh-staging
    timeout-minutes: 60
    concurrency:
      group: ${{ github.workflow }}-${{ inputs.pr_number || github.event.issue.number || github.event.pull_request.number || github.ref }}
      cancel-in-progress: true
    permissions:
      contents: read
      checks: write
      issues: write
      pull-requests: read
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: 'go.mod'
          cache: true

      # Verifies author/commenter authorization strictly against origin/main
      # (without exposing GDC secrets), stages trusted CI scripts in /tmp/ci-trusted,
      # resolves the integration test filter from changed files or commit/comment
      # directives, and checks out + merges origin/main into the target PR when
      # triggered via /test-integration or workflow_dispatch.
      - name: Verify CI Preconditions
        id: preconditions
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ inputs.pr_number }}
          CHECK_NAME: BOSH CPI Integration Test (GDC Staging)
          CPI_INTEG_FILTER: ${{ inputs.filter }}
        run: |
          git fetch origin main
          mkdir -p /tmp/ci-bootstrap
          if git show origin/main:scripts/ci-common.sh 2>/dev/null | grep -q 'verify_and_prepare_ci'; then
            git show origin/main:scripts/ci-common.sh > /tmp/ci-bootstrap/ci-common.sh
          else
            cp ./scripts/ci-common.sh /tmp/ci-bootstrap/ci-common.sh
          fi
          source /tmp/ci-bootstrap/ci-common.sh
          verify_and_prepare_ci

      - name: Run BOSH CPI Integration Test
        if: steps.preconditions.outputs.should_run == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CHECK_NAME: BOSH CPI Integration Test (GDC Staging)
          GDC_CPI_CONFIG: ${{ secrets.GDC_CPI_CONFIG }}
        run: bash "${CI_TRUSTED_DIR}/scripts/ci-integration-test.sh"
