name: CFBOSH GDC release pipeline

on:
  schedule:
    # Run once every two weeks (1st and 15th of every month at 00:00 UTC, matching GitOnBorg schedule)
    - cron: '0 0 1,15 * *'
  workflow_dispatch:
    inputs:
      release_mode:
        description: 'Pipeline execution mode (snapshot = internal GCS validation only, release = official SemVer GitHub & GCS release; release is only honoured on main)'
        required: false
        default: 'snapshot'
        type: choice
        options:
          - snapshot
          - release
      version:
        description: 'Explicit SemVer version override (e.g. 0.1.0; defaults to next SemVer derived from Git tags)'
        required: false
        type: string
      next_version:
        description: 'SemVer increment strategy derived from latest vX.Y.Z Git tag'
        required: false
        default: 'bump-patch'
        type: choice
        options:
          - bump-patch
          - bump-minor
          - bump-major
          - noop
      skip_concourse:
        description: 'Skip Concourse deployment pipeline stage (snapshot mode only, e.g. underlying infra issue; never allowed for an official release)'
        required: false
        default: false
        type: boolean
      concourse_wait_for:
        description: 'Concourse job to watch before proceeding to release stage (promote-candidate = full pipeline)'
        required: false
        default: 'promote-candidate'
        type: choice
        options:
          - promote-candidate
          - bosh-deployment
          - bosh-bootstrap
          - start-deployments
          - none

permissions:
  contents: write
  checks: write
  issues: write
  pull-requests: write
  pages: write
  id-token: write

concurrency:
  group: cfbosh-gdc-release-pipeline-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    name: 1. Authorize & Resolve SemVer
    # Only merged code reaches the shared Concourse pipeline: no pull request triggers.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    outputs:
      should_run: ${{ steps.init.outputs.should_run }}
      skip_concourse: ${{ steps.init.outputs.skip_concourse }}
      concourse_wait_for: ${{ steps.init.outputs.concourse_wait_for }}
      release_mode: ${{ steps.semver.outputs.release_mode }}
      version: ${{ steps.semver.outputs.version }}
      tag: ${{ steps.semver.outputs.tag }}
      base_version: ${{ steps.semver.outputs.base_version }}
      next_version_mode: ${{ steps.init.outputs.next_version_mode }}
      prerelease: ${{ steps.semver.outputs.prerelease }}
      latest: ${{ steps.semver.outputs.latest }}
      latest_tag: ${{ steps.semver.outputs.latest_tag }}
      commits_since_tag: ${{ steps.semver.outputs.commits_since_tag }}
      has_new_commits: ${{ steps.semver.outputs.has_new_commits }}
      target_ref: ${{ steps.init.outputs.target_ref }}
      target_branch: ${{ steps.init.outputs.target_branch }}
      start_epoch: ${{ steps.init.outputs.start_epoch }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Verify Trigger Authorization & Resolve Parameters
        id: init
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          INPUT_RELEASE_MODE: ${{ github.event.inputs.release_mode }}
          INPUT_VERSION: ${{ github.event.inputs.version }}
          INPUT_NEXT_VERSION: ${{ github.event.inputs.next_version }}
          INPUT_SKIP_CONCOURSE: ${{ github.event.inputs.skip_concourse }}
          INPUT_CONCOURSE_WAIT_FOR: ${{ github.event.inputs.concourse_wait_for }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          source ./scripts/ci-common.sh

          START_EPOCH="$(date +%s)"
          RELEASE_MODE="${INPUT_RELEASE_MODE:-snapshot}"
          EXPLICIT_VERSION="${INPUT_VERSION:-}"
          NEXT_VERSION_MODE="${INPUT_NEXT_VERSION:-bump-patch}"
          SKIP_CONCOURSE="${INPUT_SKIP_CONCOURSE:-false}"
          CONCOURSE_WAIT_FOR="${INPUT_CONCOURSE_WAIT_FOR:-promote-candidate}"
          TARGET_REF="${GITHUB_SHA}"
          # Branch that receives the bosh.io final-release metadata commit (releases/, .final_builds/)
          TARGET_BRANCH="${GITHUB_REF_NAME:-main}"
          ALLOW_BRANCH="false"

          if [[ "${GITHUB_EVENT_NAME}" == "schedule" ]]; then
            echo "[INFO] Triggered by biweekly schedule (0 0 1,15 * *); running official SemVer release."
            RELEASE_MODE="release"
          elif [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            if ! is_authorized_maintainer "${GITHUB_ACTOR}" ""; then
              echo "::error::User '${GITHUB_ACTOR}' is not authorized to trigger the release pipeline."
              exit 1
            fi
            if [[ "${GITHUB_REF_NAME:-}" != "main" ]]; then
              echo "::error::The release pipeline only runs merged code; run it from 'main' (got '${GITHUB_REF_NAME:-}')."
              exit 1
            fi
          fi

          # Invariants, independent of the trigger path:
          #  - an official release is only ever cut from main (release-cpi.sh enforces the same via Git ancestry)
          #  - an official release never skips the Concourse qualification stage
          if [[ "${RELEASE_MODE}" == "release" && ( "${ALLOW_BRANCH}" == "true" || "${GITHUB_REF_NAME:-}" != "main" ) ]]; then
            echo "::error::RELEASE_MODE=release is only allowed from the main branch (ref='${GITHUB_REF_NAME:-}', target=${TARGET_REF})."
            exit 1
          fi
          if [[ "${RELEASE_MODE}" == "release" && "${SKIP_CONCOURSE}" == "true" ]]; then
            echo "::error::skip_concourse is only supported in snapshot mode; an official release must pass the Concourse deployment stage."
            exit 1
          fi

          {
            echo "should_run=true"
            echo "skip_concourse=${SKIP_CONCOURSE}"
            echo "concourse_wait_for=${CONCOURSE_WAIT_FOR}"
            echo "release_mode=${RELEASE_MODE}"
            echo "explicit_version=${EXPLICIT_VERSION}"
            echo "next_version_mode=${NEXT_VERSION_MODE}"
            echo "target_ref=${TARGET_REF}"
            echo "target_branch=${TARGET_BRANCH}"
            echo "allow_branch=${ALLOW_BRANCH}"
            echo "start_epoch=${START_EPOCH}"
          } >>"${GITHUB_OUTPUT}"

      - name: Resolve SemVer Release Plan
        if: steps.init.outputs.should_run == 'true'
        id: semver
        run: |
          set -euo pipefail
          git checkout "${{ steps.init.outputs.target_ref }}"
          ARGS=(
            "--stage" "resolve"
            "--mode" "${{ steps.init.outputs.release_mode }}"
            "--next-version" "${{ steps.init.outputs.next_version_mode }}"
          )
          if [[ -n "${{ steps.init.outputs.explicit_version }}" ]]; then
            ARGS+=("--version" "${{ steps.init.outputs.explicit_version }}")
          fi
          if [[ "${{ steps.init.outputs.allow_branch }}" == "true" ]]; then
            ARGS+=("--allow-branch")
          fi
          ./scripts/release-cpi.sh "${ARGS[@]}"
          printf '%s\n' "${{ steps.semver.outputs.release_mode }}:${{ steps.semver.outputs.version }}" > /tmp/pipeline-meta.txt

      - name: Upload Pipeline Run Metadata Artifact
        if: steps.init.outputs.should_run == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pipeline-meta-${{ steps.semver.outputs.release_mode }}-${{ steps.semver.outputs.version }}
          path: /tmp/pipeline-meta.txt
          if-no-files-found: ignore
          retention-days: 14

  build_candidate:
    name: 2. Build Candidate CPI & Scan Vulnerabilities
    needs: [prepare]
    if: needs.prepare.outputs.should_run == 'true'
    runs-on: ubuntu-latest
    environment: cfbosh-staging
    timeout-minutes: 30
    outputs:
      sha256: ${{ steps.candidate.outputs.sha256 }}
      beta_gcs_uri: ${{ steps.candidate.outputs.beta_gcs_uri }}
    steps:
      - name: Checkout Target Revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.target_ref }}
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Run Unit & SemVer Verification Tests
        run: make test

      - name: Build Candidate BOSH CPI Release, Scan Vulnerabilities & Upload to GCS
        id: candidate
        env:
          CFBOSH_CICD_SERVICE_ACCOUNT_KEY: ${{ secrets.CFBOSH_CICD_SERVICE_ACCOUNT_KEY || secrets.GCP_SA_KEY }}
        run: |
          set -euo pipefail
          source ./scripts/ci-common.sh
          setup_gcp_sa_key "/tmp/cfbosh-cicd-sa.json" "${CFBOSH_CICD_SERVICE_ACCOUNT_KEY}"
          ./scripts/release-cpi.sh \
            --stage candidate \
            --mode "${{ needs.prepare.outputs.release_mode }}" \
            --version "${{ needs.prepare.outputs.version }}"

      - name: Upload CPI Release Tarball & Vulnerability Report Artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cpi-release-artifacts-${{ needs.prepare.outputs.version }}
          path: |
            releases/bosh-gdc-cpi/bosh-gdc-cpi-${{ needs.prepare.outputs.version }}.tgz
            releases/bosh-gdc-cpi/bosh-gdc-cpi-${{ needs.prepare.outputs.version }}.tgz.sha256
            releases/bosh-gdc-cpi/bosh_gdch_cpi_release_${{ needs.prepare.outputs.version }}.tgz
            releases/bosh-gdc-cpi/vulnerability-report-${{ needs.prepare.outputs.version }}.md
          if-no-files-found: error
          retention-days: 14

  concourse:
    name: 3. Run Concourse Deployment Pipeline (GKE)
    needs: [prepare, build_candidate]
    if: needs.prepare.outputs.should_run == 'true' && needs.prepare.outputs.skip_concourse != 'true'
    runs-on: ubuntu-latest
    environment: cfbosh-staging
    timeout-minutes: 360
    outputs:
      concourse_status: ${{ steps.run_concourse.outputs.concourse_status }}
      concourse_build: ${{ steps.run_concourse.outputs.concourse_build }}
      concourse_log_uri: ${{ steps.run_concourse.outputs.concourse_log_uri }}
    steps:
      - name: Checkout Target Revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.target_ref }}
          fetch-depth: 0

      - name: Deploy & Execute Concourse Pipeline on GKE
        id: run_concourse
        env:
          CFBOSH_CICD_SERVICE_ACCOUNT_KEY: ${{ secrets.CFBOSH_CICD_SERVICE_ACCOUNT_KEY || secrets.GCP_SA_KEY }}
          GDC_ORG: ${{ secrets.GDC_ORG }}
          GDC_CONSOLE_URL: ${{ secrets.GDC_CONSOLE_URL }}
          STEMCELL_BUILDER_REPO_URL: "https://github.com/cloudfoundry/bosh-linux-stemcell-builder.git"
          STEMCELL_BUILDER_BRANCH: "ubuntu-noble"
          # TODO: Clear STEMCELL_BUILDER_PR_REF once https://github.com/cloudfoundry/bosh-linux-stemcell-builder/pull/778 is merged into ubuntu-noble
          STEMCELL_BUILDER_PR_REF: "pull/778/head"
        run: |
          set -euo pipefail
          source ./scripts/ci-common.sh
          setup_gcp_sa_key "/tmp/cfbosh-cicd-sa.json" "${CFBOSH_CICD_SERVICE_ACCOUNT_KEY}"
          ./ci/run-pipeline.sh \
            --type prod \
            --fly-target cfbosh-concourse-gke \
            --cpi-version "${{ needs.prepare.outputs.version }}" \
            --wait-job "${{ needs.prepare.outputs.concourse_wait_for }}" \
            --status-file "/tmp/concourse-status.json"

      - name: Upload Concourse Execution Metadata
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: concourse-status-${{ needs.prepare.outputs.version }}
          path: /tmp/concourse-status.json
          if-no-files-found: ignore
          retention-days: 14

  release:
    name: 4. Release CPI Artifact (GitHub & GCS)
    needs: [prepare, build_candidate, concourse]
    if: >-
      always() &&
      needs.prepare.outputs.should_run == 'true' &&
      needs.prepare.outputs.has_new_commits == 'true' &&
      needs.build_candidate.result == 'success' &&
      (needs.concourse.result == 'success' || (needs.concourse.result == 'skipped' && needs.prepare.outputs.skip_concourse == 'true' && needs.prepare.outputs.release_mode != 'release'))
    runs-on: ubuntu-latest
    environment: cfbosh-staging
    timeout-minutes: 30
    outputs:
      release_url: ${{ steps.publish.outputs.release_url }}
      prod_gcs_uri: ${{ steps.publish.outputs.prod_gcs_uri }}
      sha256: ${{ steps.publish.outputs.sha256 }}
    steps:
      - name: Checkout Target Revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.target_ref }}
          fetch-depth: 0

      - name: Download Verified CPI Release Artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: cpi-release-artifacts-${{ needs.prepare.outputs.version }}
          path: releases/bosh-gdc-cpi

      - name: Publish CPI Release to GitHub Releases & Production GCS Bucket
        id: publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CFBOSH_CICD_SERVICE_ACCOUNT_KEY: ${{ secrets.CFBOSH_CICD_SERVICE_ACCOUNT_KEY || secrets.GCP_SA_KEY }}
          IS_LATEST: ${{ needs.prepare.outputs.latest }}
          # Final-release metadata (releases/, .final_builds/) is committed back to the branch being released
          FINAL_RELEASE_METADATA_BRANCH: ${{ needs.prepare.outputs.target_branch }}
        run: |
          set -euo pipefail
          source ./scripts/ci-common.sh
          setup_gcp_sa_key "/tmp/cfbosh-cicd-sa.json" "${CFBOSH_CICD_SERVICE_ACCOUNT_KEY}"

          CONCOURSE_STAGE_STATE="succeeded"
          if [[ "${{ needs.prepare.outputs.skip_concourse }}" == "true" ]]; then
            CONCOURSE_STAGE_STATE="skipped (manual override)"
          fi

          PUBLISH_ARGS=(
            "--stage" "publish"
            "--mode" "${{ needs.prepare.outputs.release_mode }}"
            "--version" "${{ needs.prepare.outputs.version }}"
            "--next-version" "${{ needs.prepare.outputs.next_version_mode }}"
            "--concourse-status" "${CONCOURSE_STAGE_STATE}"
          )
          if [[ "${{ needs.prepare.outputs.release_mode }}" != "release" ]]; then
            PUBLISH_ARGS+=("--no-github-release")
          fi
          ./scripts/release-cpi.sh "${PUBLISH_ARGS[@]}"

  update_dashboard:
    name: 5. Update Release Pipeline Dashboard
    needs: [prepare, build_candidate, concourse, release]
    if: >-
      always() &&
      needs.prepare.outputs.should_run == 'true' &&
      needs.prepare.outputs.has_new_commits == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      contents: write
      pages: write
      id-token: write
    steps:
      - name: Checkout Target Revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.target_branch }}
          fetch-depth: 0

      - name: Update Dashboard Data & Step Summary
        env:
          PIPELINE_START_EPOCH: ${{ needs.prepare.outputs.start_epoch }}
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
          RELEASE_MODE: ${{ needs.prepare.outputs.release_mode }}
          SKIP_CONCOURSE: ${{ needs.prepare.outputs.skip_concourse }}
          RELEASE_SHA256: ${{ needs.build_candidate.outputs.sha256 }}
          PROD_GCS_URI: ${{ needs.release.outputs.prod_gcs_uri }}
          CONCOURSE_LOG_URI: ${{ needs.concourse.outputs.concourse_log_uri }}
          BUILD_CANDIDATE_RESULT: ${{ needs.build_candidate.result }}
          CONCOURSE_RESULT: ${{ needs.concourse.result }}
          RELEASE_RESULT: ${{ needs.release.result }}
          HAS_NEW_COMMITS: ${{ needs.prepare.outputs.has_new_commits }}
          LATEST_TAG: ${{ needs.prepare.outputs.latest_tag }}
          # Commit the recorded run back to the branch that was built so the committed
          # runs.json stays the source of truth (a later push redeploys it to Pages).
          PUSH_DASHBOARD_DATA: "true"
          DASHBOARD_PUSH_BRANCH: ${{ needs.prepare.outputs.target_branch }}
        run: ./scripts/update-dashboard.sh

      - name: Setup GitHub Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Upload Dashboard Artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: './dashboard'

      - name: Deploy Dashboard to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
