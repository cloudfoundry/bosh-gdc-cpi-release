# Concourse deployment pipeline jobs skeleton in order
- type: replace
  path: /jobs?
  value:
    - name: start-deployments
    - name: bosh-bootstrap
    - name: bosh-deployment
    - name: run-bats
    - name: cf-deployment
    - name: run-cats
    - name: pre-release-fan-in
    - name: promote-candidate
    - name: report-orphaned-vms

# Job groups (UI tabs)
- type: replace
  path: /groups?
  value:
    - name: all
      jobs: [start-deployments, bosh-bootstrap, bosh-deployment, run-bats, cf-deployment, run-cats, pre-release-fan-in, promote-candidate, report-orphaned-vms]
    - name: deploy
      jobs: [start-deployments, bosh-bootstrap, bosh-deployment, cf-deployment]
    - name: acceptance-tests
      jobs: [run-bats, run-cats]
    - name: release
      jobs: [pre-release-fan-in, promote-candidate]
    - name: housekeeping
      jobs: [report-orphaned-vms]

# Remove unused resources defined from shared base.yml
- type: remove
  path: /resources/name=cicd-deployment-logs-cf-load-tests
- type: remove
  path: /resources/name=cicd-deployment-logs-teardown-deployments
- type: remove
  path: /resources/name=cicd-deployment-artifacts-cf-load-tests
- type: remove
  path: /resources/name=cicd-deployment-artifacts-teardown-deployments
- type: remove
  path: /resources/name=mwf-cron-schedule
