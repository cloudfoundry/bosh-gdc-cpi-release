# Release gate: promote-candidate only runs for a build where the same run passed
# both run-bats and run-cats. cicd-deployment-logs-bosh flows through both jobs,
# so `passed: [run-bats, run-cats]` pins one run; the cf-stage inputs come from
# the same run-cats build.
- type: replace
  path: /jobs/name=pre-release-fan-in
  value:
    name: pre-release-fan-in
    plan:
    - get: cicd-deployment-logs-bosh
      trigger: true
      passed: [run-bats, run-cats]
    - get: cicd-deployment-logs-cf
      trigger: true
      passed: [run-cats]
    - get: cicd-deployment-artifacts-cf
      passed: [run-cats]
