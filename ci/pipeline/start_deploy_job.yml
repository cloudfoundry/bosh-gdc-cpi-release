- type: replace
  path: /jobs/name=start-deployments
  value:
    name: start-deployments
    # No concurrent execution
    serial: true
    # When this job is running, other jobs with the `deployment-lock` tag have to wait
    serial_groups: [deployment-lock]
    plan:
    - get: bosh-cpi-releases
      trigger: true
    - get: cfbosh-image
    - task: create-log
      image: cfbosh-image
      config:
        platform: linux
        outputs:
        - name: log_dir
        run:
          path: bash
          args:
          - -cx
          - |
            set -e

            date=$(date +'%Y%m%d'-'%H%M%S')
            log_file=log_${date}.md

            echo "### Deployment log of the Concourse deployment pipeline" >> log_dir/${log_file}
            echo "* Build ID: build_${date}" >> log_dir/${log_file}
            echo "* Created deployment log: log_${date}.md" >> log_dir/${log_file}

            echo "[INFO] Prepared deployment log log_dir/${log_file}"
    - put: cicd-deployment-logs
      params:
        file: log_dir/log_*.md
