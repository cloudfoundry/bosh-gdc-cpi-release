resource_types:
  - name: gcs-resource
    type: registry-image
    source:
      repository: frodenas/gcs-resource
      tag: latest
  - name: time
    type: registry-image
    source:
      repository: concourse/time-resource
      tag: latest

resources:
  - name: cfbosh-image
    type: registry-image
    source:
      repository: gcr.io/cfbosh-cicd/cfbosh-build/cfbosh-builder
      tag: latest
      username: _json_key
      password: ((credentials.cfbosh-cicd-sa_key))

  # Deployment logs
  - name: cicd-deployment-logs
    type: gcs-resource
    source:
      bucket: cfbosh-cicd
      json_key: ((credentials.cfbosh-cicd-sa_key))
      regexp: cicd-deployment-logs/log_(.*).md
  - name: cicd-deployment-logs-bootstrap
    type: gcs-resource
    source:
      bucket: cfbosh-cicd
      json_key: ((credentials.cfbosh-cicd-sa_key))
      regexp: cicd-deployment-logs/artifacts/bosh_bootstrap/log_(.*).md
  - name: cicd-deployment-logs-bosh
    type: gcs-resource
    source:
      bucket: cfbosh-cicd
      json_key: ((credentials.cfbosh-cicd-sa_key))
      regexp: cicd-deployment-logs/artifacts/bosh_deploy/log_(.*).md
  - name: cicd-deployment-logs-bats
    type: gcs-resource
    source:
      bucket: cfbosh-cicd
      json_key: ((credentials.cfbosh-cicd-sa_key))
      regexp: cicd-deployment-logs/artifacts/bats/log_(.*).md
  - name: cicd-deployment-logs-cf
    type: gcs-resource
    source:
      bucket: cfbosh-cicd
      json_key: ((credentials.cfbosh-cicd-sa_key))
      regexp: cicd-deployment-logs/artifacts/cf_deploy/log_(.*).md
  - name: cicd-deployment-logs-cats
    type: gcs-resource
    source:
      bucket: cfbosh-cicd
      json_key: ((credentials.cfbosh-cicd-sa_key))
      regexp: cicd-deployment-logs/artifacts/cats/log_(.*).md
  - name: cicd-deployment-logs-cf-load-tests
    type: gcs-resource
    source:
      bucket: cfbosh-cicd
      json_key: ((credentials.cfbosh-cicd-sa_key))
      regexp: cicd-deployment-logs/artifacts/cf_load_tests/log_(.*).md
  - name: cicd-deployment-logs-teardown-deployments
    type: gcs-resource
    source:
      bucket: cfbosh-cicd
      json_key: ((credentials.cfbosh-cicd-sa_key))
      regexp: cicd-deployment-logs/artifacts/deployments_teardown/log_(.*).md

  # Concourse jobs artifacts
  - name: cicd-deployment-artifacts
    type: gcs-resource
    source:
      bucket: cfbosh-cicd
      json_key: ((credentials.cfbosh-cicd-sa_key))
      regexp: cicd-deployment-logs/artifacts/artifacts_(.*).tar.gz
  - name: cicd-deployment-artifacts-bootstrap
    type: gcs-resource
    source:
      bucket: cfbosh-cicd
      json_key: ((credentials.cfbosh-cicd-sa_key))
      regexp: cicd-deployment-logs/artifacts/bosh_bootstrap/artifacts_(.*).tar.gz
  - name: cicd-deployment-artifacts-bosh
    type: gcs-resource
    source:
      bucket: cfbosh-cicd
      json_key: ((credentials.cfbosh-cicd-sa_key))
      regexp: cicd-deployment-logs/artifacts/bosh_deploy/artifacts_(.*).tar.gz
  - name: cicd-deployment-artifacts-bats
    type: gcs-resource
    source:
      bucket: cfbosh-cicd
      json_key: ((credentials.cfbosh-cicd-sa_key))
      regexp: cicd-deployment-logs/artifacts/bats/artifacts_(.*).tar.gz
  - name: cicd-deployment-artifacts-cf
    type: gcs-resource
    source:
      bucket: cfbosh-cicd
      json_key: ((credentials.cfbosh-cicd-sa_key))
      regexp: cicd-deployment-logs/artifacts/cf_deploy/artifacts_(.*).tar.gz
  - name: cicd-deployment-artifacts-cats
    type: gcs-resource
    source:
      bucket: cfbosh-cicd
      json_key: ((credentials.cfbosh-cicd-sa_key))
      regexp: cicd-deployment-logs/artifacts/cats/artifacts_(.*).tar.gz
  - name: cicd-deployment-artifacts-cf-load-tests
    type: gcs-resource
    source:
      bucket: cfbosh-cicd
      json_key: ((credentials.cfbosh-cicd-sa_key))
      regexp: cicd-deployment-logs/artifacts/cf_load_tests/artifacts_(.*).tar.gz
  - name: cicd-deployment-artifacts-teardown-deployments
    type: gcs-resource
    source:
      bucket: cfbosh-cicd
      json_key: ((credentials.cfbosh-cicd-sa_key))
      regexp: cicd-deployment-logs/artifacts/deployments_teardown/artifacts_(.*).tar.gz

  # Beta releases
  - name: bosh-deployment-assets
    type: gcs-resource
    source:
      bucket: cfbosh-cicd
      json_key: ((credentials.cfbosh-cicd-sa_key))
      regexp: bosh-deployments/bosh_deployment_(.*).tar
  - name: cf-deployment-assets
    type: gcs-resource
    source:
      bucket: cfbosh-cicd
      json_key: ((credentials.cfbosh-cicd-sa_key))
      regexp: cf-deployments/cf_deployment_(.*).tar
  - name: noble-stemcells
    type: gcs-resource
    source:
      bucket: cfbosh-cicd
      json_key: ((credentials.cfbosh-cicd-sa_key))
      regexp: stemcells/use_metadata_server/bosh-stemcell-([0-9]{8}-.*)-gdch-kvm-ubuntu-noble.tgz
  - name: bosh-cpi-releases
    type: gcs-resource
    source:
      bucket: cfbosh-cicd
      json_key: ((credentials.cfbosh-cicd-sa_key))
      regexp: cpi_releases/bosh_gdch_cpi_release_(.*).tgz

  # Time schedule on Mondays, Wednesdays, and Fridays for scheduled deployment runs.
  - name: mwf-cron-schedule
    type: time
    source:
      cron: "0 5 * * 1,3,5"
      location: America/New_York
